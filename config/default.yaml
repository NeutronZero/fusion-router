server:
  host: "127.0.0.1"
  port: 8080
  shutdown_timeout_secs: 30
  cors:
    allowed_origins: []
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - content-type
      - authorization
      - x-api-key
      - x-request-id

resources:
  max_daily_cost: 10.0
  max_daily_tokens: 1000000
  max_concurrent: 5
  max_concurrent_nodes: 16
  provider_limits:
    opencode-zen:
      max_daily_cost: 5.0
      max_rpm: 60
      max_tpm: 500000
    openrouter:
      max_daily_cost: 5.0
      max_rpm: 60
      max_tpm: 500000

policies:
  - name: default
    priority: 1
    conditions: []
    actions:
      - action_type: set_strategy
        params:
          strategy: "auto"

strategies:
  consensus_count: 3

providers:
  zen:
    transport: "zen"
    base_url: "https://opencode.ai/zen/v1"
    api_key_env: "OPENCODEZEN_API_KEY"
    failure_threshold: 5
    cooldown_secs: 30
  openrouter:
    transport: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    failure_threshold: 5
    cooldown_secs: 30

  # Generic OpenAI-compatible providers (covers 75+ providers).
  # Set transport to any recognized name for automatic base_url defaults,
  # or provide an explicit base_url for custom endpoints.
  #
  # Examples (uncomment to enable):
  #
  # deepseek:
  #   transport: "openai-chat"
  #   api_key_env: "DEEPSEEK_API_KEY"
  #   models:
  #     deepseek-chat:
  #       name: "DeepSeek V4 Pro"
  #       context_limit: 128000
  #       output_limit: 8192
  #       coding_score: 0.9
  #       reasoning_score: 0.85
  #       supports_tools: true
  #       supports_streaming: true
  #       supports_vision: false
  #       supports_thinking: true
  #       input_cost_per_1k: 0.00014
  #       output_cost_per_1k: 0.00028
  #       latency_ms: 500
  #       availability: "high"
  #
  # groq:
  #   transport: "openai-chat"
  #   api_key_env: "GROQ_API_KEY"
  #   models:
  #     llama-3.3-70b-versatile:
  #       name: "Llama 3.3 70B"
  #       context_limit: 128000
  #       output_limit: 4096
  #       coding_score: 0.75
  #       reasoning_score: 0.7
  #       supports_tools: true
  #       supports_streaming: true
  #       input_cost_per_1k: 0.00059
  #       output_cost_per_1k: 0.00079
  #       latency_ms: 200
  #       availability: "high"
  #
  # custom-ollama:
  #   transport: "openai-chat"
  #   base_url: "http://localhost:11434/v1"
  #   models:
  #     llama3.2:
  #       name: "Llama 3.2 (local)"
  #       context_limit: 8192
  #       output_limit: 2048
  #       supports_tools: false
  #       supports_vision: false
  #       latency_ms: 100
  #       availability: "local"
  #
  # helicone:
  #   transport: "openai-chat"
  #   base_url: "https://ai-gateway.helicone.ai"
  #   headers:
  #     Helicone-Cache-Enabled: "true"
  #     Helicone-User-Id: "fusion-router"
  #   models:
  #     gpt-4o:
  #       name: "GPT-4o via Helicone"
  #       context_limit: 128000
  #       coding_score: 0.92
  #       reasoning_score: 0.88
  #     claude-sonnet-4-20250514:
  #       name: "Claude Sonnet 4 via Helicone"
  #       context_limit: 200000
  #       coding_score: 0.93
  #       reasoning_score: 0.91

connectors:
  my-github:
    connector_type: github
    config:
      token_env: GITHUB_TOKEN
  my-filesystem:
    connector_type: filesystem
    config:
      allowed_paths: ["./data"]

# Authentication (fail-closed: enabled by default; set at least one api_key)
auth:
  enabled: true
  api_keys: []
  # When enabled, requests must include x-api-key header matching one of api_keys.
  # Whitelisted paths: /health, /ready, /metrics

# Rate limiting (fail-closed: enabled by default)
rate_limiting:
  enabled: true
  requests_per_minute: 60
  burst_size: 10
  cleanup_interval_secs: 300
  # Uses token-bucket algorithm per client (peer address or authenticated identity)

# Structured logging
logging:
  format: "text"     # "text" or "json"
  level: "info"      # tracing level directive
  directory: ~       # optional log directory

# Streaming (experimental, checkpoint-based)
streaming:
  enabled: false
  checkpoint_interval_chunks: 100
  default_chunk_timeout_secs: 30

tools:
  # Fail-closed (ADR-035 / Law 7): no shell commands, no HTTP tool, no
  # automatic tool execution, no unrestricted shell arguments by default.
  allowed_shell_commands: []
  shell_timeout_secs: 10
  allowed_read_directories:
    - "."
  enable_http_tool: false
  allow_auto_exec: false
  allow_unrestricted_args: false

# Feature flags (runtime overridable)
features:
  streaming:
    enabled: true
  replay:
    enabled: false
  connector-health:
    enabled: true
  semantic-cache:
    enabled: false
  wasm-plugins:
    enabled: false

# Model catalog (provider-agnostic role -> model mapping)
# Configure these for your deployment; empty strings will cause resolution errors
model_catalog:
  code: ""
  debug: ""
  architecture: ""
  general: ""
  creative: ""
  analysis: ""
  fast: ""
  cheap: ""
