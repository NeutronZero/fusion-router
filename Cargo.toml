[package]
name = "fusion-router"
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    "crates/fusion-plugin-api",
    "crates/fusion-capability-macros",
    "crates/fusion-capability-sdk",
    "crates/fusion-ir",
    "plugins/example-provider",
    "plugins/fusion-plugin-echo",
]

[features]
default = ["semantic-cache"]
semantic-cache = ["dep:usearch"]
wasm-plugins = ["dep:wasmtime"]
dev-console = ["console-subscriber"]
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry", "tonic"]

[dependencies]
fusion-plugin-api = { path = "crates/fusion-plugin-api" }
fusion-ir = { path = "crates/fusion-ir" }
libloading = "0.8"
toml = "0.8"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["json", "stream"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
console-subscriber = { version = "0.4", optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
tonic = { version = "0.12", optional = true }
anyhow = "1"
meval = "0.2"
parking_lot = "0.12"
arc-swap = "1"
prometheus = { version = "0.14", features = ["process"] }
tokio-tungstenite = "0.21"
thiserror = "1"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
dashmap = "5"
rand = "0.8"
futures = "0.3"
rusqlite = { version = "0.29", features = ["bundled"] }
dotenv = "0.15"
semver = { version = "1.0", features = ["serde"] }
usearch = { version = "2", optional = true }
wasmtime = { version = "47", optional = true, default-features = false, features = ["cranelift", "wat", "runtime", "std", "anyhow"] }
petgraph = "0.8.3"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"
ctrlc = "3"
http = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
fusion-plugin-echo = { path = "plugins/fusion-plugin-echo" }
fusion-capability-sdk = { path = "crates/fusion-capability-sdk" }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
wat = "1"

[[bench]]
name = "compilation"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "strategy_lowering"
harness = false

[[example]]
name = "run_debate_pipeline"
path = "examples/run_debate_pipeline.rs"

[profile.dev]
incremental = false
opt-level = 0
debug = true
# "packed" saves ~40% disk vs "unpacked". Good for Windows.
# On Unix/macOS, change to "unpacked" for faster debug builds.
split-debuginfo = "packed"

# Cranelift backend for faster debug builds (nightly-only)
# To enable, run: rustup component add rustc-codegen-cranelift --toolchain nightly
# Then uncomment and use: cargo +nightly build -Zcodegen-backend=cranelift
#
# [profile.dev.package.fusion-router]
# codegen-backend = "cranelift"
