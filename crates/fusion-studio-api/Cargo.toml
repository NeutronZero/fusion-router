[package]
name = "fusion-studio-api"
version = "0.14.0"
edition = "2021"

[dependencies]
fusion-core = { path = "../fusion-core" }
fusion-kernel = { path = "../fusion-kernel" }
fusion-api-public = { path = "../fusion-api-public" }
fusion-compiler = { path = "../fusion-compiler" }
fusion-planner = { path = "../fusion-planner" }
fusion-ir = { path = "../fusion-ir" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fusion-security = { path = "../fusion-security" }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
