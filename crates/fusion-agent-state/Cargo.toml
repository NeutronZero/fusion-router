[package]
name = "fusion-agent-state"
version = "0.14.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SKILL.state: explicit mutable execution state above fusion-runtime (P,Σ,O loop)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fusion-core = { path = "../fusion-core" }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
async-trait = "0.1"
rusqlite = { version = "0.29", features = ["bundled"] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"
