[package]
name = "fusion-types"
version = "0.14.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Execution-layer types shared across the fusion-router workspace"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
