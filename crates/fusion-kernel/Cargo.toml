[package]
name = "fusion-kernel"
version = "0.14.5"
edition = "2021"

[dependencies]
fusion-core = { path = "../fusion-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
