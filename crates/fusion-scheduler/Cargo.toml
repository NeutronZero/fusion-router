[package]
name = "fusion-scheduler"
version = "0.14.5"
edition = "2021"

[dependencies]
fusion-core = { path = "../fusion-core" }
fusion-types = { path = "../fusion-types" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }



