[package]
name = "fusion-scheduler"
version = "0.14.5"
edition = "2021"

[dependencies]
fusion-core = { path = "../fusion-core" }
fusion-types = { path = "../fusion-types" }
fusion-kernel = { path = "../fusion-kernel" }
fusion-api-internal = { path = "../fusion-api-internal" }
fusion-placement = { path = "../fusion-placement" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
