[package]
name = "fusion-runtime"
version = "0.14.5"
edition = "2021"

[dependencies]
fusion-core = { path = "../fusion-core" }
fusion-types = { path = "../fusion-types" }
fusion-scheduler = { path = "../fusion-scheduler" }
fusion-kernel = { path = "../fusion-kernel" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
