[package]
name = "fusion-planner"
version = "0.14.5"
edition = "2021"

[dependencies]
fusion-core = { path = "../fusion-core" }
fusion-kernel = { path = "../fusion-kernel" }
fusion-plugin-api = { path = "../fusion-plugin-api" }
fusion-api-internal = { path = "../fusion-api-internal" }
fusion-ir = { path = "../fusion-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
parking_lot = "0.12"
semver = { version = "1.0", features = ["serde"] }
uuid = { version = "1", features = ["v5"] }
