[package]
name = "fusion-compiler"
version = "0.14.5"
edition = "2021"

[dependencies]
fusion-core = { path = "../fusion-core" }
fusion-kernel = { path = "../fusion-kernel" }
fusion-api-internal = { path = "../fusion-api-internal" }
fusion-ir = { path = "../fusion-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
