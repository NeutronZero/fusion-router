[package]
name = "fusion-plugin-api"
version = "0.14.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minimal SDK for FusionRouter Capability Plugins"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1.0", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"
fusion-core = { path = "../fusion-core" }
